{% extends 'admin_base.html' %}

{% block content %}
<div class="admin-page-header">
    <h2>Registered Users</h2>
    <p>All accounts registered on the customer portal</p>
</div>

<div class="glass-panel" style="padding: 2rem;">
    <div class="table-container" style="box-shadow: none;">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td style="color: var(--text-muted); font-size: 0.9rem;">#{{ user.id }}</td>
                    <td style="font-weight: 600;">{{ user.name }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.phone }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" style="text-align: center; padding: 3rem; color: var(--text-muted);">No users found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
